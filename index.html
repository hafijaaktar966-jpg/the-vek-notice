    <style>
        * {
            margin: 0;

        body {
            background-color: #f4f6f9;

            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 25px;
            font-size: 28px;

            padding-bottom: 10px;
        }

        /* নোটিশ আইটেম স্টাইল */
        .notice-item {
            border-left: 5px solid #3b82f6;
            background: #f8fafc;
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 0 8px 8px 0;
            transition: transform 0.2s;
        }

        .notice-item:hover {
            transform: translateX(5px);
            background: #f1f5f9;
        }

        /* গুরুত্বপুর্ণ বা অ্যাকশন নোটিশের জন্য রেড কালার */
        .notice-item.urgent {
            border-left-color: #ef4444;
            background: #fef2f2;
        }

        .notice-date {
            font-size: 13px;
            color: #64748b;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .notice-title {
            font-size: 18px;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .notice-content {
            font-size: 15px;
            color: #334155;
            line-height: 1.6;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            font-size: 11px;
            color: #fff;
            background: #ef4444;
            border-radius: 4px;
            margin-left: 10px;
            font-weight: bold;
        }
    </style>
